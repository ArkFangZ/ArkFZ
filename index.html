<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkFZの游戏实验室</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.2);
        }
        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: #f1f5f9;
        }
        .card p {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.4;
        }
        .card .btn-text {
            margin-top: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <h1>✨ArkFZ的 Web 游戏库</h1>
    <p class="subtitle">选择下方任意项目开始体验</p>

    <div class="game-grid">
        <!-- 寻机头卡片 -->
        <a class="card" href="./xunjitou/">
            <div>
                <h2>寻机头</h2>
                <p>经典 10x10 寻机头游戏。</p>
            </div>
            <div class="btn-text">开始游戏 &rarr;</div>
        </a>

        <a class="card" href="./dujiaoshou/">
            <div>
                <h2>商业独角兽</h2>
                <p>占领地盘争当南波万</p>
            </div>
            <div class="btn-text">开始游戏 &rarr;</div>
        </a>
        
        <a class="card" href="./dujiaoshou2/">
            <div>
                <h2>商业独角兽联机版</h2>
                <p>和朋友们来一场精彩的对决吧！</p>
            </div>
            <div class="btn-text">开始游戏 &rarr;</div>
        

        <!-- 以后有新游戏时，复制下方这段代码并修改路径和名字即可 -->
        <!--
        <a class="card" href="./game2/">
            <div>
                <h2>新游戏名称</h2>
                <p>游戏简短说明</p>
            </div>
            <div class="btn-text">开始游戏 &rarr;</div>
        </a>
        -->
    </div>

</body>
</html>
