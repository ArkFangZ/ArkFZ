<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkFZの游戏实验室 - 名侦探学院游戏库</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #080c19;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* 霓虹特效标题 */
        .neon-title {
            font-family: 'Noto Sans SC', 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 30%, #b820e6 70%, #ff2a85 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(79, 172, 254, 0.4);
        }

        /* 背景极光动画 */
        .bg-glow-1 {
            position: absolute;
            top: -10%;
            left: 20%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 0;
            animation: pulse-glow 8s infinite alternate ease-in-out;
        }

        .bg-glow-2 {
            position: absolute;
            bottom: -5%;
            right: 15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 42, 133, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            animation: pulse-glow 10s infinite alternate-reverse ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.15) translate(20px, 30px); opacity: 1; }
        }

        /* 网格背景线 */
        .cyber-grid {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* 卡片玻璃拟态与发光边框 */
        .card-cyber {
            background: rgba(19, 27, 49, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.15);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .card-cyber::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transition: 0.6s;
        }

        .card-cyber:hover::before {
            left: 100%;
        }

        .card-cyber:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(0, 242, 254, 0.6);
            box-shadow: 0 12px 30px -5px rgba(0, 242, 254, 0.25),
                        0 0 15px 0 rgba(184, 32, 230, 0.2);
        }

        /* 联机版特别高亮样式 */
        .card-multiplayer {
            border: 1px solid rgba(255, 42, 133, 0.25);
        }
        .card-multiplayer:hover {
            border-color: rgba(255, 42, 133, 0.7);
            box-shadow: 0 12px 30px -5px rgba(255, 42, 133, 0.3),
                        0 0 20px 0 rgba(0, 242, 254, 0.2);
        }

        /* 侦探剪影 Badge */
        .badge-online {
            background: linear-gradient(135deg, #ff2a85, #b820e6);
        }
        .badge-solo {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
        }
    </style>
</head>
