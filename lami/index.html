<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>

    <title>爱拼才会赢</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"Orbitron"', 'monospace'],
                    },
                    animation: {
                        'pop': 'pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    },
                    keyframes: {
                        pop: {
                            '0%': { transform: 'scale(0.8)', opacity: '0.5' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                    }
                }
            }
        }

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 牌桌卡牌样式（保持原样小尺寸） */
        .rummi-card {
            width: 28px;
            height: 40px;
            border-radius: 5px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 0.85rem;
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.15);
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            position: relative;
            touch-action: none;
            flex-shrink: 0;
            user-select: none;
        }

        /* 手牌专用加大样式 */
        .hand-card {
            width: 42px !important;
            height: 60px !important;
            font-size: 1.25rem !important;
            border-radius: 7px !important;
        }

        @media (min-width: 640px) {
            .rummi-card {
                width: 32px;
                height: 46px;
                font-size: 0.95rem;
                border-radius: 6px;
            }
            .hand-card {
                width: 48px !important;
                height: 68px !important;
                font-size: 1.4rem !important;
                border-radius: 8px !important;
            }
        }

        .rummi-card:active {
            cursor: grabbing;
        }

        .dark .rummi-card {
            background: #1e293b;
            border: 1.5px solid #334155;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
        }
        html:not(.dark) .rummi-card {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            box-shadow: 0 2px 5px rgba(148, 163, 184, 0.25);
        }

        .card-black { color: #0f172a; }
        .dark .card-black { color: #f8fafc; }
        .card-red { color: #ef4444; }
        .card-blue { color: #3b82f6; }
        .card-yellow { color: #f59e0b; }
        
        .rummi-card.selected {
            transform: translateY(-6px) scale(1.08);
            border-color: #3b82f6 !important;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
        }
        .dark .rummi-card.selected {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.85);
        }

        .rummi-card.joker {
            background: linear-gradient(135deg, #a855f7, #ec4899) !important;
            color: #ffffff !important;
            border-color: #f472b6 !important;
        }

        /* 牌组取消灰色边框，仅保留间距与背景 */
        .card-group {
            border-radius: 10px;
            padding: 4px;
            display: flex;
            gap: 3px;
            align-items: center;
            min-height: 52px;
            min-width: 52px;
            transition: all 0.2s ease;
            position: relative;
            border: 1.5px solid transparent;
        }
        .dark .card-group {
            background: rgba(15, 23, 42, 0.4);
        }
        html:not(.dark) .card-group {
            background: rgba(241, 245, 249, 0.6);
        }

        /* 拖拽吸附高亮 */
        .card-group.drop-target {
            border-color: #3b82f6 !important;
            background: rgba(59, 130, 246, 0.15) !important;
            transform: scale(1.02);
        }

        /* 错误提示框仍旧保留 */
        .card-group.invalid-group {
            border-color: #ef4444 !important;
            background: rgba(239, 68, 68, 0.12) !important;
        }

        @keyframes turnPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }
        .your-turn-anim {
            animation: turnPulse 1.2s infinite ease-in-out;
        }

        .hand-flex-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            justify-content: flex-start;
            min-height: 80px;
            max-height: 180px;
            overflow-y: auto;
            padding: 4px;

/* 手机端拖拽时的跟随浮动卡牌 Ghost */

    <!-- 核心逻辑脚本 -->
    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }
        function playTone(freq, type, duration, gainVal = 0.1) {
            try {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }
        function playSound(type) {
            initAudio();
            if (type === 'select') playTone(400, 'sine', 0.05, 0.05);
            else if (type === 'play') playTone(600, 'triangle', 0.12, 0.1);
            else if (type === 'draw') playTone(300, 'sine', 0.08, 0.08);
            else if (type === 'win') {
                [392, 523, 659, 784].forEach((f, idx) => {
                    setTimeout(() => playTone(f, 'triangle', 0.2, 0.15), idx * 90);
                });
            }
        }

        function initTheme() {
            const btn = document.getElementById('themeToggleBtn');
            const icon = document.getElementById('themeIcon');
            const saved = localStorage.getItem('rummi_theme') || 'dark';
            if (saved === 'dark') {
                document.documentElement.classList.add('dark');
                icon.className = 'fa-solid fa-sun text-base text-amber-400';
            } else {
                document.documentElement.classList.remove('dark');
                icon.className = 'fa-solid fa-moon text-base text-slate-500';
            }
            btn.addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('rummi_theme', isDark ? 'dark' : 'light');
                icon.className = isDark ? 'fa-solid fa-sun text-base text-amber-400' : 'fa-solid fa-moon text-base text-slate-500';
                updateUI();
            });
        }

        function openRulesModal() { document.getElementById('rulesModal').classList.remove('hidden'); }
        function closeRulesModal() { document.getElementById('rulesModal').classList.add('hidden'); }

        const COLORS = ['black', 'red', 'blue', 'yellow'];
        let deck = [];
        let playerHand = [];
        let ai1Hand = [];
        let ai2Hand = [];
        
        let playerHasBrokenIce = false;
        let ai1HasBrokenIce = false;
        let ai2HasBrokenIce = false;

        let tableGroups = []; 
        let selectedHandIndices = new Set();
	let turn = 0; // 0: 玩家, 1: AI-1, 2: AI-2
        let isGameOver = false;
        let hasDrawnThisTurn = false; // 限制一回合只能摸一张牌
 // ====== 新增：终局限时冲刺相关变量 ======
	let isEndgameRush = false;      // 是否进入了终局冲刺
	let endgameTimer = null;        // 倒计时定时器
	let endgameTimeLeft = 90;       // 剩余秒数
	let endgameOrder = [];          // 终局出牌顺序，例如 ["player", "ai1", "ai2"]
	let endgameCurrentIndex = 0;    // 当前在终局顺序中的第几个人

        let turnSnapshot = null;

        // 自动将顺子与同号组在桌面上整齐升序排序，万能牌位置精准插入中间
        function autoSortAllTableGroups() {
            tableGroups.forEach(group => {
                const inferred = inferGroupCardPositions(group);
                if (inferred.isRun) {
                    group.sort((a, b) => inferred.posMap.get(a) - inferred.posMap.get(b));
                } else if (inferred.isSet) {
                    group.sort((a, b) => {
                        if (a.isJoker) return 1;
                        if (b.isJoker) return -1;
                        return a.color.localeCompare(b.color);
                    });
                }
            });
        }

function inferGroupCardPositions(group) {
            if (!group || group.length === 0) return { isRun: false, isSet: false, posMap: new Map(), valid: false, sum: 0 };

            const posMap = new Map();
            const nonJokers = group.filter(c => !c.isJoker);

            // 1. 全是 Joker 的特殊情况（至少3张）
            if (nonJokers.length === 0) {
                if (group.length < 3) return { isRun: false, isSet: false, posMap, valid: false, sum: 0 };
                group.forEach((c, idx) => posMap.set(c, 10 + idx));
                return { isRun: true, isSet: false, posMap, valid: true, sum: group.length * 10 };
            }

            // 2. 验证同号异色组 (Set: 3-4张不同色同数字，如三张10)
            const firstVal = nonJokers[0].value;
            const isSetCandidate = nonJokers.every(c => c.value === firstVal) && group.length >= 3 && group.length <= 4;
            if (isSetCandidate) {
                // 检查非Joker颜色是否重复
                const colors = nonJokers.map(c => c.color);
                const uniqueColors = new Set(colors);
                if (uniqueColors.size === colors.length) {
                    group.forEach((c, idx) => posMap.set(c, firstVal));
                    // 修复点：确保刻子能正确返回总分（例如三张10就是 30 分）
                    return { isRun: false, isSet: true, posMap, valid: true, sum: firstVal * group.length };
                }
            }

            // 3. 验证同色顺子组 (Run: 3张以上同色连续数字)
            const sameColorCandidate = nonJokers[0].color;
            const isSameColorCandidate = nonJokers.every(c => c.color === sameColorCandidate);

            if (isSameColorCandidate && group.length >= 3) {
                const sortedNonJokers = [...nonJokers].sort((a, b) => a.value - b.value);
                
                let hasDuplicate = false;
                for (let i = 0; i < sortedNonJokers.length - 1; i++) {
                    if (sortedNonJokers[i].value === sortedNonJokers[i+1].value) hasDuplicate = true;
                }

                if (!hasDuplicate) {
                    let jokers = group.filter(c => c.isJoker);
                    let minNonJoker = sortedNonJokers[0].value;
                    let maxNonJoker = sortedNonJokers[sortedNonJokers.length - 1].value;
                    
                    let foundValid = false;
                    let bestSum = 0;
                    let bestPosMap = new Map();
                    const totalLen = group.length;
                    
                    for (let start = Math.max(1, minNonJoker - jokers.length); start <= minNonJoker; start++) {
                        let end = start + totalLen - 1;
                        if (end > 13 || end < maxNonJoker) continue;

                        let tempMap = new Map();
                        let availableJokers = [...jokers];
                        let isValidRange = true;
                        let currentSum = 0;

                        for (let v = start; v <= end; v++) {
                            currentSum += v;
                            let matchingNonJoker = sortedNonJokers.find(nj => nj.value === v);
                            if (matchingNonJoker) {
                                tempMap.set(matchingNonJoker, v);
                            } else {
                                if (availableJokers.length > 0) {
                                    let jCard = availableJokers.shift();
                                    tempMap.set(jCard, v);
                                } else {
                                    isValidRange = false;
                                    break;
                                }
                            }
                        }

                        if (isValidRange && availableJokers.length === 0) {
                            foundValid = true;
                            bestSum = currentSum;
                            bestPosMap = tempMap;
                            break;
                        }
                    }

                    if (foundValid) {
                        return { isRun: true, isSet: false, posMap: bestPosMap, valid: true, sum: bestSum };
                    }
                }
            }

            group.forEach((c, idx) => posMap.set(c, c.value || 0));
            return { isRun: false, isSet: false, posMap, valid: false, sum: 0 };
        }

function removeFromSource(fromInfo) {
            if (!fromInfo) return;
            if (fromInfo.type === 'hand') {
                playerHand.splice(fromInfo.cardIndex, 1);

            } else if (fromInfo.type === 'table') {
                const sourceGroup = tableGroups[fromInfo.groupIndex];
                if (sourceGroup && sourceGroup[fromInfo.cardIndex]) {
                    sourceGroup.splice(fromInfo.cardIndex, 1);
                    if (sourceGroup.length === 0) {
                        tableGroups.splice(fromInfo.groupIndex, 1);
                    }
                }
            }
        }

        function handleDrop(e, targetGroupIdx) {
            e.preventDefault();

            if (!draggedCard || turn !== 0 || isGameOver) return;

	if (!playerHasBrokenIce && targetGroupIdx !== -1 && targetGroupIdx < initialTableGroupsCount) {

                draggedCard = null;

                updateUI();
                return;
            }

            let insertIndex = -1;
            if (targetGroupIdx !== -1) {
                const groupEl = e.currentTarget;
                const cardNodes = Array.from(groupEl.querySelectorAll('.rummi-card'));
                const mouseX = e.clientX;

                insertIndex = cardNodes.length;
                for (let i = 0; i < cardNodes.length; i++) {
                    const rect = cardNodes[i].getBoundingClientRect();
                    const midX = rect.left + rect.width / 2;
                    if (mouseX < midX) {
                        insertIndex = i;
                        break;
                    }
                }
            }

            removeFromSource(draggedFrom);

            if (targetGroupIdx === -1) {
                tableGroups.push([draggedCard]);
            } else {
                const targetGroup = tableGroups[targetGroupIdx];
                if (insertIndex >= 0 && insertIndex <= targetGroup.length) {
                    targetGroup.splice(insertIndex, 0, draggedCard);
                } else {
                    targetGroup.push(draggedCard);
                }
            }

            playSound('play');
            draggedCard = null;
            draggedFrom = null;
            updateUI();
        }

                endTurn();

        }

        function findBestPlay(handCards, hasBrokenIce) {
            for (let i = 0; i < handCards.length; i++) {
                for (let j = i + 1; j < handCards.length; j++) {
                    for (let k = j + 1; k < handCards.length; k++) {
                        const candidate = [handCards[i], handCards[j], handCards[k]];
                        const res = validateGroup(candidate);
                        if (res.valid) {
                            if (!hasBrokenIce && res.sum < 30) continue;
                            return { cards: candidate, sum: res.sum };
                        }
                    }
                }
            }
            return null;
        }

        function setNotice(msg) {
            document.getElementById('gameNotice').innerText = msg;
        }

        function handleGameOver(winnerName) {
            isGameOver = true;
            playSound('win');
            document.getElementById('winnerTitle').innerText = `${winnerName} 获得胜利！`;
            
            const pSum = playerHand.reduce((acc, c) => acc + (c.isJoker ? 30 : c.value), 0);
            const ai1Sum = ai1Hand.reduce((acc, c) => acc + (c.isJoker ? 30 : c.value), 0);
            const ai2Sum = ai2Hand.reduce((acc, c) => acc + (c.isJoker ? 30 : c.value), 0);

            const scoreboard = document.getElementById('scoreboard');
            scoreboard.innerHTML = `
                <div class="flex justify-between items-center py-1">
                    <span><b>玩家    </b> (剩余: ${playerHand.length}张)</span>
                </div>
                <div class="flex justify-between items-center py-1 border-t border-slate-200 dark:border-slate-700/60">
                    <span><b>机器人1</b> (剩余: ${ai1Hand.length}张)</span>
                </div>
                <div class="flex justify-between items-center py-1 border-t border-slate-200 dark:border-slate-700/60">
                    <span><b>机器人2</b> (剩余: ${ai2Hand.length}张)</span>
                </div>
            `;

            document.getElementById('victoryModal').classList.remove('hidden');
        }

        function inspectGameTable() {
            document.getElementById('victoryModal').classList.add('hidden');
            document.getElementById('topRestartBtn').classList.remove('hidden');
            document.getElementById('actionButtons').classList.add('pointer-events-none', 'opacity-50');
            setNotice("正在查看终局战局盘面");
        }
// ================= 手机端触摸拖拽 (Touch Drag & Drop) 实现 =================
        let touchDragState = {
            active: false,
            card: null,
            from: null
        };

        function bindTouchDrag(cardEl, card, fromInfo) {
            cardEl.addEventListener('touchstart', (e) => {
                if (turn !== 0 || isGameOver) return;
                const touch = e.touches[0];
                touchDragState.active = true;
                touchDragState.card = card;
                touchDragState.from = fromInfo;

                const ghost = document.getElementById('floating-drag-ghost');
                ghost.className = cardEl.className;
                ghost.innerHTML = cardEl.innerHTML;
                ghost.style.display = 'flex';
                ghost.style.left = touch.clientX + 'px';
                ghost.style.top = touch.clientY + 'px';

                cardEl.style.opacity = '0.4';
                e.stopPropagation();
            }, { passive: true });

            cardEl.addEventListener('touchmove', (e) => {
                if (!touchDragState.active) return;
                const touch = e.touches[0];
                const ghost = document.getElementById('floating-drag-ghost');
                ghost.style.left = touch.clientX + 'px';
                ghost.style.top = touch.clientY + 'px';

                const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                document.querySelectorAll('.card-group, #unifiedBoard, #playerHandPanel').forEach(el => el.classList.remove('drop-target', 'ring-2', 'ring-blue-400'));
                
                const targetGroup = elemBelow ? elemBelow.closest('.card-group') : null;
                const targetBoard = elemBelow ? elemBelow.closest('#unifiedBoard') : null;
                const targetHand = elemBelow ? elemBelow.closest('#playerHandPanel') : null;

                if (targetGroup) targetGroup.classList.add('drop-target');
                else if (targetBoard) targetBoard.classList.add('drop-target');
                else if (targetHand) targetHand.classList.add('ring-2', 'ring-blue-400');
            }, { passive: true });

            cardEl.addEventListener('touchend', (e) => {
                if (!touchDragState.active) return;
                touchDragState.active = false;
                const ghost = document.getElementById('floating-drag-ghost');
                ghost.style.display = 'none';
                cardEl.style.opacity = '1';

                const touch = e.changedTouches[0];
                const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                document.querySelectorAll('.card-group, #unifiedBoard, #playerHandPanel').forEach(el => el.classList.remove('drop-target', 'ring-2', 'ring-blue-400'));

                if (!elemBelow) return;

                const targetHand = elemBelow.closest('#playerHandPanel');
                const targetGroup = elemBelow.closest('.card-group');
                const targetBoard = elemBelow.closest('#unifiedBoard');

                draggedCard = touchDragState.card;
                draggedFrom = touchDragState.from;

                if (targetHand) {
                    handleDropToHand();
                } else if (targetGroup) {
                    const groups = Array.from(document.querySelectorAll('.card-group'));
                    const gIdx = groups.indexOf(targetGroup);
                    if (gIdx !== -1) {
                        const cardNodes = Array.from(targetGroup.querySelectorAll('.rummi-card'));
                        let insertIndex = cardNodes.length;
                        for (let i = 0; i < cardNodes.length; i++) {
                            const rect = cardNodes[i].getBoundingClientRect();
                            if (touch.clientX < rect.left + rect.width / 2) {
                                insertIndex = i;
                                break;
                            }
                        }
                        executeDropToGroup(gIdx, insertIndex);
                    }
                } else if (targetBoard) {
                    handleDropToUnifiedBoard();
                }

                draggedCard = null;
                draggedFrom = null;
            });
        }

function handleDropToHand() {
            if (!draggedCard || turn !== 0 || isGameOver) return;
            
            if (draggedFrom && draggedFrom.type === 'table') {
	    if (!playerHasBrokenIce && draggedFrom.groupIndex < initialTableGroupsCount) {
                    setNotice("❌ 未破冰前，不能从桌面上原有的牌组中拿走牌！");
                    draggedCard = null;
                    draggedFrom = null;
                    updateUI();
                    return;
                }

                if (!draggedCard.isCurrentTurnPlayed) {
                    setNotice("❌ 不能将战场旧牌（非本轮打出的牌）拉回手牌！");
                    draggedCard = null;
                    draggedFrom = null;
                    return;
                }

                const sourceGroup = tableGroups[draggedFrom.groupIndex];
                if (sourceGroup) {
                    sourceGroup.splice(draggedFrom.cardIndex, 1);
                    if (sourceGroup.length === 0) {
                        tableGroups.splice(draggedFrom.groupIndex, 1);
                    }
                }

                // 关键点：拿回手牌，清除“本轮已出”标记
                draggedCard.isCurrentTurnPlayed = false;
                playerHand.push(draggedCard);
                playSound('select');
                draggedCard = null;
                draggedFrom = null;
                updateUI();
                setNotice("已将本轮出牌收回到手牌");
            }
        }

function handleDropToUnifiedBoard() {
            if (!draggedCard || turn !== 0 || isGameOver) return;
            
            // 关键点：只要是从手牌拖出来的，或者重新调整的，都算本轮打出
            if (draggedFrom && draggedFrom.type === 'hand') {
                draggedCard.isCurrentTurnPlayed = true;
            }
            
            removeFromSource(draggedFrom);
            tableGroups.push([draggedCard]);
            playSound('play');
            draggedCard = null;
            draggedFrom = null;
            updateUI();
        }

        function executeDropToGroup(targetGroupIdx, insertIndex) {
            if (!draggedCard || turn !== 0 || isGameOver) return;
	    if (!playerHasBrokenIce && targetGroupIdx !== -1 && targetGroupIdx < initialTableGroupsCount) {
                setNotice("❌ 未破冰前，不能将牌加入桌面上原有的牌组中！必须自己独立打出新牌组。");
                draggedCard = null;
                draggedFrom = null;
                updateUI();
                return;
	}
            // 关键点：如果是手牌拖过来的，标记为本轮出牌
            if (draggedFrom && draggedFrom.type === 'hand') {
                draggedCard.isCurrentTurnPlayed = true;
            }

            removeFromSource(draggedFrom);
            const targetGroup = tableGroups[targetGroupIdx];
            if (targetGroup) {
                if (insertIndex >= 0 && insertIndex <= targetGroup.length) {
                    targetGroup.splice(insertIndex, 0, draggedCard);
                } else {
                    targetGroup.push(draggedCard);
                }
            }
            playSound('play');
            draggedCard = null;
            draggedFrom = null;
            updateUI();
        }
        window.onload = function() {
            initTheme();
            initGame();
        };

// ====== 新增：终局限时冲刺核心逻辑 ======
// ====== 修改：每人独立90秒冲刺逻辑 ======
function triggerEndgameRush(lastTakerId) {
    if (lastTakerId === 0) {
        endgameOrder = [1, 2, 0]; // B -> C -> A
    } else if (lastTakerId === 1) {
        endgameOrder = [2, 0, 1]; // C -> A -> B
    } else {
        endgameOrder = [0, 1, 2]; // A -> B -> C
    }

    isEndgameRush = true;
    endgameCurrentIndex = 0;

    let rushBanner = document.getElementById('endgameRushBanner');
    if (!rushBanner) {
        rushBanner = document.createElement('div');
        rushBanner.id = 'endgameRushBanner';
        rushBanner.className = 'w-full bg-rose-600 text-white font-black text-center py-2 px-4 rounded-xl text-xs sm:text-sm shadow-lg mb-2 animate-bounce-short flex justify-between items-center';
        const mainEl = document.querySelector('main');
        mainEl.insertBefore(rushBanner, mainEl.firstChild);
    }

    startPersonEndgameTimer();
    runEndgameTurn();
}

function startPersonEndgameTimer() {
    if (endgameTimer) clearInterval(endgameTimer);
    endgameTimeLeft = 90; // 每个人独立重置为 90 秒
    
    endgameTimer = setInterval(() => {
        endgameTimeLeft--;
        updateEndgameBannerText();
        
        if (endgameTimeLeft <= 0) {
            clearInterval(endgameTimer);
            setNotice("⏱️ 您的 90 秒已到，自动过轮！");
            // 个人时间到，直接强制切换到下一个人的 90 秒回合
            advanceEndgameTurn();
        }
    }, 1000);
}

function updateEndgameBannerText() {
    const banner = document.getElementById('endgameRushBanner');
    if (!banner) return;
    const currentWho = endgameOrder[endgameCurrentIndex];
    const nameMap = { 0: "玩家", 1: "机器人1", 2: "机器人2" };
    const roundCount = endgameCurrentIndex + 1;
    banner.innerHTML = `<span>🔥 终局限时冲刺 (第${roundCount}/3轮)</span> <span class="bg-black/30 px-2 py-0.5 rounded">当前：${nameMap[currentWho]}</span> <span class="text-amber-300 font-mono text-sm">⏱️ ${endgameTimeLeft}s</span>`;
}

function runEndgameTurn() {
    if (isGameOver) return;
    updateEndgameBannerText();
    
    const activePlayerId = endgameOrder[endgameCurrentIndex];
    turn = activePlayerId; // 同步当前回合控制权
    updateUI();

    if (activePlayerId === 0) {
        setNotice("⚡ 终局冲刺：轮到你了！请限时出牌！");
    } else if (activePlayerId === 1) {
        setNotice("⚡ 终局冲刺：机器人1 正在疯狂出牌...");
        // 调整延迟至 1500ms（1.5秒），让机器人动作连贯且有节奏感
        setTimeout(() => executeEndgameAiTurn(1), 1500);
    } else if (activePlayerId === 2) {
        setNotice("⚡ 终局冲刺：机器人2 正在疯狂出牌...");
        setTimeout(() => executeEndgameAiTurn(2), 1500);
    }
}

function executeEndgameAiTurn(aiId) {
    if (isGameOver || !isEndgameRush) return;
    let aiHand = aiId === 1 ? ai1Hand : ai2Hand;
    let name = aiId === 1 ? "机器人1" : "机器人2";

    // 确保 AI 在终局冲刺时已破冰，可以无限制出牌和拼接
    if (aiId === 1) ai1HasBrokenIce = true;
    if (aiId === 2) ai2HasBrokenIce = true;

    let playedSomething = false;

    // 终局智能连续出牌循环（最多尝试打出多组或拼接多张牌）
    for (let attempt = 0; attempt < 6; attempt++) {
        let actionTaken = false;

        // 1. 优先尝试：在终局中无条件寻找手牌能组成的新顺子或刻子
        let bestPlay = findBestPlay(aiHand, true);
        if (bestPlay) {
            aiHand = aiHand.filter(c => !bestPlay.cards.includes(c));
            tableGroups.push(bestPlay.cards);
            actionTaken = true;
            playedSomething = true;
        } else {
            // 2. 次要尝试：把单张手牌塞到桌面上已有牌组的头部或尾部
            for (let hIdx = 0; hIdx < aiHand.length; hIdx++) {
                const card = aiHand[hIdx];
                let attached = false;
                for (let gIdx = 0; gIdx < tableGroups.length; gIdx++) {
                    const testGroup = [...tableGroups[gIdx], card];
                    if (validateGroup(testGroup).valid) {
                        tableGroups[gIdx].push(card);
                        aiHand.splice(hIdx, 1);
                        attached = true;
                        actionTaken = true;
                        playedSomething = true;
                        break;
                    }
                }
                if (attached) break; 
            }
        }

        if (!actionTaken) break; // 如果实在没牌可出了就跳出循环
    }

    // 将更新后的手牌写回对应 AI
    if (aiId === 1) ai1Hand = aiHand; else ai2Hand = aiHand;

    if (playedSomething) {
        playSound('play');
        autoSortAllTableGroups();
        setNotice(`⚡ 终局冲刺：${name} 成功打出或拼接了卡牌！`);
    } else {
        setNotice(`⚡ 终局冲刺：${name} 本回合手牌无法出牌`);
    }

    // 检查 AI 是否清空了手牌
    if (aiHand.length === 0) {
        if (endgameTimer) clearInterval(endgameTimer);
        handleGameOver(name + " (终局清空手牌)");
        return;
    }

    updateUI();
    
    // 稍作停顿后自动推进到下一个人的90秒回合
    setTimeout(() => {
        advanceEndgameTurn();
    }, 1200);
}

function advanceEndgameTurn() {
    if (isGameOver || !isEndgameRush) return;
    if (endgameTimer) clearInterval(endgameTimer);

    endgameCurrentIndex++;
    // 如果 3 个人（索引 0, 1, 2）各 90 秒全部结束了一次
    if (endgameCurrentIndex >= endgameOrder.length) {
        isEndgameRush = false;
        handleEndgameTimeout(); // 三人各90秒完成，比拼手牌最少结算
        return;
    }

    // 开启下一个人的 90 秒
    startPersonEndgameTimer();
    runEndgameTurn();
}

function handleEndgameTimeout() {
    if (isGameOver) return;
    if (endgameTimer) clearInterval(endgameTimer);
    
    // 时间到，比较剩余手牌最少者获胜
    const pLen = playerHand.length;
    const ai1Len = ai1Hand.length;
    const ai2Len = ai2Hand.length;

    let minLen = Math.min(pLen, ai1Len, ai2Len);
    let winners = [];
    if (pLen === minLen) winners.push("玩家");
    if (ai1Len === minLen) winners.push("机器人1");
    if (ai2Len === minLen) winners.push("机器人2");

    let winnerText = winners.join(" & ") + "";
    handleGameOver(winnerText);
}
