<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">

<!-- 引入 Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- 引入 FontAwesome 图标 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- 引入现代化字体 -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                },
                animation: {
                    'pop': 'pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    'float': 'float 2s ease-in-out infinite',
                },
                keyframes: {
                    pop: {
                        '0%': { transform: 'scale(0.8)', opacity: '0.5' },
                        '100%': { transform: 'scale(1)', opacity: '1' },
                    },
                    float: {
                        '0%, 100%': { transform: 'translateY(0)' },
                        '50%': { transform: 'translateY(-4px)' }
                    }
                }
            }
        }
    }
</script>
<style>
    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        transition: background-color 0.3s ease, color 0.3s ease;
    }
    .cell {
        aspect-ratio: 1 / 1;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cell[data-owner="p1"] { background-color: #ffb7b2 !important; }
    .cell[data-owner="p2"] { background-color: #a0c4ff !important; }
    .cell[data-owner="p3"] { background-color: #caffbf !important; }
    
    .cell.highlight { 
        box-shadow: inset 0 0 0 3px #ffb703; 
        cursor: pointer; 
        animation: pulse-highlight 1.5s infinite;
    }
    @keyframes pulse-highlight {
        0% { box-shadow: inset 0 0 0 3px rgba(255, 183, 3, 0.6); }
        50% { box-shadow: inset 0 0 0 4px rgba(255, 183, 3, 1); }
        100% { box-shadow: inset 0 0 0 3px rgba(255, 183, 3, 0.6); }
    }
    .cell.selected { 
        box-shadow: inset 0 0 0 4px #06d6a0, 0 0 12px rgba(6, 214, 160, 0.5); 
        transform: scale(0.93); 
    }
</style>
</head>

</footer>

<script>
// --- 音效系统 (Web Audio API 合成) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }
function playTone(freq, type, duration, gainVal = 0.1) {
    try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
}
function playSound(type) {
    initAudio();
    if (type === 'move') playTone(300, 'sine', 0.08, 0.05);
    else if (type === 'rent') playTone(180, 'sawtooth', 0.15, 0.1);
    else if (type === 'carpet') playTone(523, 'triangle', 0.12, 0.12);
    else if (type === 'win') {
        [392, 523, 659, 784].forEach((f, idx) => {
            setTimeout(() => playTone(f, 'triangle', 0.2, 0.15), idx * 90);
        });
    }
}

// --- 暗色模式切换逻辑 ---
function initTheme() {
    const btn = document.getElementById('themeToggleBtn');
    const icon = document.getElementById('themeIcon');
    const saved = localStorage.getItem('unicorn_theme') || 'dark';
    if (saved === 'dark') {
        document.documentElement.classList.add('dark');
        icon.className = 'fa-solid fa-sun text-lg text-amber-400';
    } else {
        document.documentElement.classList.remove('dark');
        icon.className = 'fa-solid fa-moon text-lg text-slate-500';
    }
    btn.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('unicorn_theme', isDark ? 'dark' : 'light');
        icon.className = isDark ? 'fa-solid fa-sun text-lg text-amber-400' : 'fa-solid fa-moon text-lg text-slate-500';
    });
}

// --- 游戏核心逻辑 ---
const SIZE = 7;
let boardData = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null).map(() => []));
let unicorn = { x: 3, y: 3, dir: 0 };
const DIR_VECTORS = [{x:0, y:1}, {x:1, y:0}, {x:0, y:-1}, {x:-1, y:0}];
const DIR_SYMBOLS = ['↑', '→', '↓', '←'];

let players = {
  p1: { coins: 30, carpets: 15, name: '玩家', color: 'p1' },
  p2: { coins: 30, carpets: 15, name: 'AI 1', color: 'p2' },
  p3: { coins: 30, carpets: 15, name: 'AI 2', color: 'p3' }
};
const playerKeys = ['p1', 'p2', 'p3'];
let currentPlayerIndex = 0;
let currentPlayer = playerKeys[currentPlayerIndex];

let gameState = 'MOVE_SELECT';
let selectedCells = [];
let allowedRange = 1;

const boardEl = document.getElementById('board');
const logEl = document.getElementById('log');

function createBoardDOM() {
  boardEl.innerHTML = '';
  for (let r = SIZE - 1; r >= 0; r--) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell w-14 h-14 bg-slate-100 dark:bg-slate-900/80 rounded-xl border border-slate-200 dark:border-slate-700/50 flex flex-col items-center justify-center relative cursor-default shadow-sm';
      cell.dataset.x = c;
      cell.dataset.y = r;
      cell.addEventListener('click', () => handleCellClick(c, r));
      boardEl.appendChild(cell);
    }
  }
  render();
}

function log(msg) {
  logEl.innerHTML += `<div>${msg}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}

function render() {
  document.querySelectorAll('.cell').forEach(el => {
    const x = parseInt(el.dataset.x);
    const y = parseInt(el.dataset.y);
    const stack = boardData[y][x];
    
    el.removeAttribute('data-owner');
    el.innerHTML = '';
    el.classList.remove('highlight', 'selected');

    if (stack.length > 0) {
      const top = stack[stack.length - 1];
      el.setAttribute('data-owner', top.owner);
    }

    if (x === unicorn.x && y === unicorn.y) {
      el.innerHTML = `
        <div class="unicorn-container flex items-center justify-center gap-1 text-2xl animate-float">
          <span>🦄</span>
          <span class="dir-indicator text-xs font-black text-rose-500">${DIR_SYMBOLS[unicorn.dir]}</span>
        </div>
      `;
    }
  });

  playerKeys.forEach(k => {
    document.getElementById(`${k}-coins`).innerText = players[k].coins;
    document.getElementById(`${k}-carpets`).innerText = players[k].carpets;
    const card = document.getElementById(`${k}-card`);
    if (currentPlayer === k) {
        card.className = `player-info flex-1 text-center p-2 rounded-xl transition-all bg-white dark:bg-slate-900 shadow-sm ring-2 ring-pink-400`;
    } else {
        card.className = `player-info flex-1 text-center p-2 rounded-xl transition-all opacity-70`;
    }
  });

  document.getElementById('turn-indicator').innerText = `轮到：${players[currentPlayer].name}`;
}

// --- 完美修正后的蛇形移动与撞墙跨步逻辑 (左下0,0 右上6,6笛卡尔坐标系) ---
function moveUnicornStep() {
  let vec = DIR_VECTORS[unicorn.dir];
  let nx = unicorn.x + vec.x;
  let ny = unicorn.y + vec.y;

  // 上边界 (y = 6)
  if (ny >= SIZE) {
    if (unicorn.x === 0) { 
      unicorn.x = 1; 
      unicorn.y = SIZE - 1; 
      unicorn.dir = 1; // (0,6) 向上撞 -> 拐到 (1,6) 并向右
    } else {
      if (unicorn.x === 1) unicorn.x = 2;
      else if (unicorn.x === 2) unicorn.x = 1;
      else if (unicorn.x === 3) unicorn.x = 4;
      else if (unicorn.x === 4) unicorn.x = 3;
      else if (unicorn.x === 5) unicorn.x = 6;
      else if (unicorn.x === 6) { 
        unicorn.x = 5; 
        unicorn.y = SIZE - 1; 
        unicorn.dir = 2; // (6,6) 向上撞 -> 拐到 (5,6) 并向下
        return; 
      }
      unicorn.y = SIZE - 1;
      unicorn.dir = 2; // 顶部其他列向上撞 -> 平移并改为向下走
    }
  } 
  // 下边界 (y = 0)
  else if (ny < 0) {
    if (unicorn.x === 6) { 
      unicorn.x = 5; 
      unicorn.y = 0; 
      unicorn.dir = 3; // (6,0) 向下撞 -> 拐到 (5,0) 并向左
    }
    else if (unicorn.x === 0) { 
      unicorn.x = 0; 
      unicorn.y = 1; 
      unicorn.dir = 0; // (0,0) 向下撞 -> 拐到 (0,1) 并向上
    }
    else {
      if (unicorn.x === 1) unicorn.x = 0;
      else if (unicorn.x === 2) unicorn.x = 3;
      else if (unicorn.x === 3) unicorn.x = 2;
      else if (unicorn.x === 4) unicorn.x = 5;
      else if (unicorn.x === 5) unicorn.x = 4;
      unicorn.y = 0;
      unicorn.dir = 0; // 底部其他列向下撞 -> 平移并改为向上走
    }
  } 
  // 左边界 (x = 0)
  else if (nx < 0) {
    if (unicorn.y === 0) { 
      unicorn.x = 0; 
      unicorn.y = 1; 
      unicorn.dir = 1; // (0,0) 向左撞 -> 拐到 (0,1) 并向右
    }
    else if (unicorn.y === SIZE - 1) { 
      unicorn.x = 0; 
      unicorn.y = SIZE - 2; 
      unicorn.dir = 2; // (0,6) 向左撞 -> 拐到 (0,5) 并向下
    }
    else {
      if (unicorn.y === 1) unicorn.y = 0;
      else if (unicorn.y === 2) unicorn.y = 3;
      else if (unicorn.y === 3) unicorn.y = 2;
      else if (unicorn.y === 4) unicorn.y = 5;
      else if (unicorn.y === 5) unicorn.y = 4;
      else if (unicorn.y === 6) unicorn.y = 5;
      unicorn.x = 0;
      unicorn.dir = 1; // 左侧其他行向左撞 -> 平移并改为向右走
    }
  } 
  // 右边界 (x = 6)
  else if (nx >= SIZE) {
    if (unicorn.y === SIZE - 1) { 
      unicorn.x = SIZE - 1; 
      unicorn.y = SIZE - 2; 
      unicorn.dir = 2; // (6,6) 向右撞 -> 拐到 (6,5) 并向下
    }
    else if (unicorn.y === 0) { 
      unicorn.x = SIZE - 1; 
      unicorn.y = 1; 
      unicorn.dir = 0; // (6,0) 向右撞 -> 拐到 (6,1) 并向上
    }
    else {
      if (unicorn.y === 0) unicorn.y = 6;
      else if (unicorn.y === 1) unicorn.y = 2;
      else if (unicorn.y === 2) unicorn.y = 1;
      else if (unicorn.y === 3) unicorn.y = 4;
      else if (unicorn.y === 4) unicorn.y = 3;
      else if (unicorn.y === 5) unicorn.y = 6;
      unicorn.x = SIZE - 1;
      unicorn.dir = 3; // 右侧其他行向右撞 -> 平移并改为向左走
    }
  } 
  // 正常内部移动
  else {
    unicorn.x = nx;
    unicorn.y = ny;
  }
}
document.getElementById('roll-btn').addEventListener('click', () => {
  if (gameState !== 'MOVE_SELECT' || currentPlayer !== 'p1') return;
  startTurnAction('p1');
});

function startTurnAction(playerKey) {
  const isAI = playerKey !== 'p1';
  let actionChoice = 'forward';
  
  if (isAI) {
    const choices = ['forward', 'left', 'right'];
    actionChoice = choices[Math.floor(Math.random() * choices.length)];
  } else {
    actionChoice = document.getElementById('dir-input').value;
  }

  let actionText = "直行";
  if (actionChoice === 'left') {
    unicorn.dir = (unicorn.dir + 3) % 4;
    actionText = "向左转";
  } else if (actionChoice === 'right') {
    unicorn.dir = (unicorn.dir + 1) % 4;
    actionText = "向右转";
  }

  const steps = Math.floor(Math.random() * 4) + 1;
  log(`${players[playerKey].name} 选择了【${actionText}】，掷出了 <b>${steps}</b> 点！`);

  document.getElementById('roll-btn').disabled = true;
  gameState = 'ANIMATING';

  let currentStep = 0;
  let stepInterval = setInterval(() => {
    if (currentStep < steps) {
      moveUnicornStep();
      render();
      playSound('move');
      currentStep++;
    } else {
      clearInterval(stepInterval);
      checkRent();
      gameState = 'CARPET_SELECT';
      
      allowedRange = hasValidPairsInBox(1) ? 1 : 2;
      
      if (!isAI) {
        if (allowedRange === 1) {
          document.getElementById('action-hint').innerText = "步骤：请在九宫格内选择 2 个相邻格子铺地毯";
        } else {
          document.getElementById('action-hint').innerText = "⚠️ 九宫格无解！已扩展至 5x5 范围";
        }
      }
      
      highlightValidCarpetOptions();

      if (isAI) {
        setTimeout(() => aiExecuteCarpet(playerKey), 1000);
      }
    }
  }, 300);
}

function checkRent() {
  const stack = boardData[unicorn.y][unicorn.x];
  if (stack.length === 0) return;

  const topOwner = stack[stack.length - 1].owner;
  if (topOwner === currentPlayer) return;

  let visited = Array(SIZE).fill(false).map(() => Array(SIZE).fill(false));
  let queue = [{x: unicorn.x, y: unicorn.y}];
  visited[unicorn.y][unicorn.x] = true;
  let areaSize = 0;

  while (queue.length > 0) {
    let curr = queue.shift();
    areaSize++;

    const neighbors = [
      {x: curr.x+1, y: curr.y}, {x: curr.x-1, y: curr.y},
      {x: curr.x, y: curr.y+1}, {x: curr.x, y: curr.y-1}
    ];

    for (let n of neighbors) {
      if (n.x >= 0 && n.x < SIZE && n.y >= 0 && n.y < SIZE && !visited[n.y][n.x]) {
        const nStack = boardData[n.y][n.x];
        if (nStack.length > 0 && nStack[nStack.length - 1].owner === topOwner) {
          visited[n.y][n.x] = true;
          queue.push(n);
        }
      }
    }
  }

  playSound('rent');
  log(`⚠️ 踩中 ${players[topOwner].name} 的地盘！连通面积 ${areaSize} 格，支付 ${areaSize} 金币租金！`);
  players[currentPlayer].coins -= areaSize;
  players[topOwner].coins += areaSize;
  render();
}

function checkCarpetValidity(pos1, pos2) {
  const s1 = boardData[pos1.y][pos1.x];
  const s2 = boardData[pos2.y][pos2.x];
  
  let top1 = s1.length > 0 ? s1[s1.length - 1] : null;
  let top2 = s2.length > 0 ? s2[s2.length - 1] : null;

  let owner1 = top1 ? top1.owner : null;
  let owner2 = top2 ? top2.owner : null;

  if (owner1 !== null && owner2 !== null && owner1 === owner2) {
    return false;
  }
  return true;
}

function hasValidPairsInBox(range) {
  let neighbors = [];
  for (let dx = -range; dx <= range; dx++) {
    for (let dy = -range; dy <= range; dy++) {
      let nx = unicorn.x + dx;
      let ny = unicorn.y + dy;
      if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && !(nx === unicorn.x && ny === unicorn.y)) {
        neighbors.push({x: nx, y: ny});
      }
    }
  }

  for (let i = 0; i < neighbors.length; i++) {
    for (let j = i + 1; j < neighbors.length; j++) {
      let p1 = neighbors[i];
      let p2 = neighbors[j];
      if (Math.abs(p1.x - p2.x) + Math.abs(p1.y - p2.y) === 1) {
        if (range === 2) {
          const p1In3 = Math.abs(p1.x - unicorn.x) <= 1 && Math.abs(p1.y - unicorn.y) <= 1;
          const p2In3 = Math.abs(p2.x - unicorn.x) <= 1 && Math.abs(p2.y - unicorn.y) <= 1;
          if (!p1In3 && !p2In3) continue;
        }
        if (checkCarpetValidity(p1, p2)) return true;
      }
    }
  }
  return false;
}

function highlightValidCarpetOptions() {
  selectedCells = [];
  document.querySelectorAll('.cell').forEach(el => {
    const x = parseInt(el.dataset.x);
    const y = parseInt(el.dataset.y);
    if (Math.abs(x - unicorn.x) <= allowedRange && Math.abs(y - unicorn.y) <= allowedRange && !(x === unicorn.x && y === unicorn.y)) {
      el.classList.add('highlight');
    }
  });
}

function handleCellClick(x, y) {
  if (gameState !== 'CARPET_SELECT' || currentPlayer !== 'p1') return;
  if (x === unicorn.x && y === unicorn.y) return;
  if (Math.abs(x - unicorn.x) > allowedRange || Math.abs(y - unicorn.y) > allowedRange) return;

  if (selectedCells.length === 0) {
    selectedCells.push({x, y});
    getCellEl(x, y).classList.add('selected');
  } else if (selectedCells.length === 1) {
    const first = selectedCells[0];
    const firstIn3 = Math.abs(first.x - unicorn.x) <= 1 && Math.abs(first.y - unicorn.y) <= 1;
    const secondIn3 = Math.abs(x - unicorn.x) <= 1 && Math.abs(y - unicorn.y) <= 1;

    let validRangeRule = (allowedRange === 1) ? (firstIn3 && secondIn3) : (firstIn3 || secondIn3);

    if (Math.abs(first.x - x) + Math.abs(first.y - y) === 1 && validRangeRule) {
      if (validateAndPlaceCarpet(selectedCells[0], {x, y}, 'p1')) {
        endTurn();
      } else {
        resetSelection();
      }
    } else {
      log("❌ 位置不符合当前范围规则！");
      resetSelection();
    }
  }
}

function resetSelection() {
  selectedCells = [];
  document.querySelectorAll('.cell.selected').forEach(e => e.classList.remove('selected'));
}

function getCellEl(x, y) {
  return document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
}

function validateAndPlaceCarpet(pos1, pos2, playerKey) {
  if (!checkCarpetValidity(pos1, pos2)) {
    if (playerKey === 'p1') {
      log("❌ 非法铺设：不能同时覆盖两格最上层都是同色地毯！");
    }
    return false;
  }

  const carpetId = `${playerKey}_${Date.now()}_${Math.random()}`;
  boardData[pos1.y][pos1.x].push({ owner: playerKey, id: carpetId });
  boardData[pos2.y][pos2.x].push({ owner: playerKey, id: carpetId });

  players[playerKey].carpets--;
  playSound('carpet');
  log(`${players[playerKey].name} 铺设地毯于 (${pos1.x},${pos1.y}) 和 (${pos2.x},${pos2.y})`);
  return true;
}

function aiExecuteCarpet(aiKey) {
  if (gameState !== 'CARPET_SELECT') return;

  let rangeToUse = allowedRange;
  let neighbors = [];
  for (let dx = -rangeToUse; dx <= rangeToUse; dx++) {
    for (let dy = -rangeToUse; dy <= rangeToUse; dy++) {
      let nx = unicorn.x + dx;
      let ny = unicorn.y + dy;
      if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && !(nx === unicorn.x && ny === unicorn.y)) {
        neighbors.push({x: nx, y: ny});
      }
    }
  }

  let validPairs = [];
  for (let i = 0; i < neighbors.length; i++) {
    for (let j = i + 1; j < neighbors.length; j++) {
      let p1 = neighbors[i];
      let p2 = neighbors[j];
      if (Math.abs(p1.x - p2.x) + Math.abs(p1.y - p2.y) === 1) {
        if (rangeToUse === 2) {
          const p1In3 = Math.abs(p1.x - unicorn.x) <= 1 && Math.abs(p1.y - unicorn.y) <= 1;
          const p2In3 = Math.abs(p2.x - unicorn.x) <= 1 && Math.abs(p2.y - unicorn.y) <= 1;
          if (!p1In3 && !p2In3) continue;
        }
        if (checkCarpetValidity(p1, p2)) {
          validPairs.push([p1, p2]);
        }
      }
    }
  }

  if (validPairs.length > 0) {
    const choice = validPairs[Math.floor(Math.random() * validPairs.length)];
    validateAndPlaceCarpet(choice[0], choice[1], aiKey);
  } else {
    log(`${players[aiKey].name} 无合法位置可铺，跳过`);
  }

  endTurn();
}

function endTurn() {
  resetSelection();
  render();

  let allOutOfCarpets = playerKeys.every(k => players[k].carpets === 0);
  if (allOutOfCarpets) {
    checkGameOver();
    return;
  }

  currentPlayerIndex = (currentPlayerIndex + 1) % playerKeys.length;
  currentPlayer = playerKeys[currentPlayerIndex];

  gameState = 'MOVE_SELECT';
  const isAI = currentPlayer !== 'p1';
  document.getElementById('roll-btn').disabled = isAI;
  document.getElementById('action-hint').innerText = !isAI ? "步骤：请选择策略并掷骰子" : `${players[currentPlayer].name} 思考中...`;

  if (isAI) {
    setTimeout(() => startTurnAction(currentPlayer), 1000);
  }
}

function checkGameOver() {
  gameState = 'GAME_OVER';
  document.getElementById('roll-btn').disabled = true;
  playSound('win');

  let areas = {};
  playerKeys.forEach(k => areas[k] = 0);

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const stack = boardData[r][c];
      if (stack.length > 0) {
        const topOwner = stack[stack.length - 1].owner;
        if (areas[topOwner] !== undefined) {
          areas[topOwner]++;
        }
      }
    }
  }

  let sorted = [...playerKeys].sort((a, b) => {
    if (players[b].coins !== players[a].coins) return players[b].coins - players[a].coins;
    return areas[b] - areas[b];
  });

  let winnerKey = sorted[0];
  
  let resultHTML = "";
  sorted.forEach((k, index) => {
    let rankText = `第 ${index + 1} 名`;
    resultHTML += `<div class="flex justify-between items-center py-1 border-b border-slate-200 dark:border-slate-700/50 last:border-0"><span class="font-semibold text-slate-500">${rankText} <b>${players[k].name}</b></span>: <span class="text-pink-500 font-bold">${players[k].coins} 金币</span> (可见: ${areas[k]})</div>`;
  });
  
  document.getElementById('modal-result-text').innerHTML = `
    <div class="mb-2 font-extrabold text-pink-500 text-xs text-center">最终胜者：${players[winnerKey].name}！</div>
    ${resultHTML}
  `;
  document.getElementById('victoryModal').classList.remove('hidden');
}

window.onload = () => {
    initTheme();
    createBoardDOM();
};
</script>
