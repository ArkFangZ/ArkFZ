<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商业独角兽</title>
<!-- 引入 PeerJS WebRTC 库 -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg-color: #f7f3fc;
    --panel-bg: #ffffff;
    --accent: #ff8fab;
    --p1-color: #ffb7b2; /* 玩家1/房主：马卡龙粉 */
    --p2-color: #a0c4ff; /* 玩家2：马卡龙蓝 */
    --p3-color: #caffbf; /* 玩家3：马卡龙绿 */
    --grid-bg: #fffff9;  
  }
  body {
    margin: 0;
    padding: 20px;
    background-color: var(--bg-color);
    color: #4a4a4a;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { margin-bottom: 10px; font-size: 24px; color: #6c5b7b; }
  
  .game-container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .status-card {
    background: var(--panel-bg);
    padding: 15px 20px;
    border-radius: 16px;
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }
  .player-info { text-align: center; padding: 5px 10px; border-radius: 8px; }
  .player-info.active { background: #f0f0f5; border-bottom: 3px solid var(--accent); }
  .p1-text { color: #e07a5f; font-weight: bold; }
  .p2-text { color: #3d5a80; font-weight: bold; }
  .p3-text { color: #2b9348; font-weight: bold; }

  .board-outer {
    display: grid;
    grid-template-columns: repeat(7, 52px);
    grid-template-rows: repeat(7, 52px);
    gap: 5px;
    background: #e3d5ca;
    padding: 12px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
  }

  .cell {
    width: 52px;
    height: 52px;
    background: var(--grid-bg);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: default;
    transition: all 0.2s;
  }

  .cell[data-owner="p1"] { background-color: var(--p1-color); }
  .cell[data-owner="p2"] { background-color: var(--p2-color); }
  .cell[data-owner="p3"] { background-color: var(--p3-color); }

  .cell.highlight { 
    box-shadow: inset 0 0 0 3px #ffb703; 
    cursor: pointer; 
  }
  .cell.selected { 
    box-shadow: inset 0 0 0 4px #06d6a0, 0 0 8px #06d6a0; 
    transform: scale(0.95); 
  }

  .unicorn-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 20px;
  }
  .dir-indicator {
    font-size: 11px;
    font-weight: bold;
    color: #d90429;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    width: 15px;
    height: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .controls {
    background: var(--panel-bg);
    padding: 20px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 260px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:disabled { background: #d3d3d3; cursor: not-allowed; }
  button:hover:not(:disabled) { filter: brightness(1.05); }

  .log-box {
    background: #f8f9fa;
    border-radius: 10px;
    padding: 10px;
    height: 140px;
    overflow-y: auto;
    font-size: 12px;
    color: #666;
    font-family: monospace;
    border: 1px solid #eee;
  }

  /* 联机扩展样式（内嵌于控制栏） */
  .online-box {
    background: #f0f4f8;
    padding: 10px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 12px;
  }
  .online-input-group {
    display: flex;
    gap: 5px;
  }
  .online-input-group input {
    flex: 1;
    padding: 6px;
    border: 1px solid #ddd;
    border-radius: 6px;
    text-align: center;
    font-weight: bold;
  }
  .online-btn {
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 6px;
  }
</style>
</head>
<body>

<h1>🦄商业独角兽</h1>

<div class="status-card">
  <div class="player-info" id="p1-card">
    <div class="p1-text" id="p1-name">玩家 1</div>
    <div>金币: <span id="p1-coins">30</span></div>
    <div>地毯: <span id="p1-carpets">15</span></div>
  </div>
  <div class="player-info" id="p2-card">
    <div class="p2-text" id="p2-name">玩家 2</div>
    <div>金币: <span id="p2-coins">30</span></div>
    <div>地毯: <span id="p2-carpets">15</span></div>
  </div>
  <div class="player-info" id="p3-card">
    <div class="p3-text" id="p3-name">玩家 3</div>
    <div>金币: <span id="p3-coins">30</span></div>
    <div>地毯: <span id="p3-carpets">15</span></div>
  </div>
</div>

<div class="game-container">
  <div class="board-outer" id="board"></div>

  <div class="controls">
    <!-- 房间码联机面板 -->
    <div class="online-box">
      <div style="font-weight:bold; color:#555; text-align:center;">🌐 联机对战 (房间码)</div>
      <div id="room-status" style="color:#888; text-align:center;">单机模式中</div>
      <div class="online-input-group">
        <button class="online-btn" id="create-room-btn">创建房间</button>
        <input type="text" id="room-code-input" placeholder="输入4位房间码" maxlength="4">
        <button class="online-btn" id="join-room-btn">加入</button>
      </div>
    </div>

    <div id="turn-indicator" style="text-align: center; font-weight: bold; color: #6c5b7b;">轮到：玩家 1</div>
    
    <div id="dir-select">
      <label style="font-size: 13px; color: #888;">移动策略选择：</label>
      <select id="dir-input" style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd;">
        <option value="forward">直行</option>
        <option value="left">左转</option>
        <option value="right">右转</option>
      </select>
    </div>

    <button id="roll-btn">掷骰子</button>
    
    <div style="font-size: 12px; color: #888;" id="action-hint">步骤：请选择策略并掷骰子</div>
    
    <div class="log-box" id="log"></div>
  </div>
</div>

<script>
const SIZE = 7;
let boardData = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null).map(() => []));
let unicorn = { x: 3, y: 3, dir: 0 };
const DIR_VECTORS = [{x:0, y:1}, {x:1, y:0}, {x:0, y:-1}, {x:-1, y:0}];
const DIR_SYMBOLS = ['↑', '→', '↓', '←'];

let players = {
  p1: { coins: 30, carpets: 15, name: '玩家 1', color: 'p1', isAI: false },
  p2: { coins: 30, carpets: 15, name: 'AI 1', color: 'p2', isAI: true },
  p3: { coins: 30, carpets: 15, name: 'AI 2', color: 'p3', isAI: true }
};
const playerKeys = ['p1', 'p2', 'p3'];
let currentPlayerIndex = 0;
let currentPlayer = playerKeys[currentPlayerIndex];

let gameState = 'MOVE_SELECT';
let selectedCells = [];
let allowedRange = 1;

// 联机相关变量
let peer = null;
let connections = {}; // 储存所有连接 (房主连接客户端，客户端连接房主)
let myPlayerKey = 'p1'; // 本地玩家对应的key，单机模式下默认是 p1
let isHost = false;
let isOnlineMode = false;

const boardEl = document.getElementById('board');
const logEl = document.getElementById('log');

function createBoardDOM() {
  boardEl.innerHTML = '';
  for (let r = SIZE - 1; r >= 0; r--) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.x = c;
      cell.dataset.y = r;
      cell.addEventListener('click', () => handleCellClick(c, r));
      boardEl.appendChild(cell);
    }
  }
  render();
}

function log(msg) {
  logEl.innerHTML += `<div>${msg}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}

function render() {
  document.querySelectorAll('.cell').forEach(el => {
    const x = parseInt(el.dataset.x);
    const y = parseInt(el.dataset.y);
    const stack = boardData[y][x];
    
    el.removeAttribute('data-owner');
    el.innerHTML = '';
    el.classList.remove('highlight', 'selected');

    if (stack.length > 0) {
      const top = stack[stack.length - 1];
      el.setAttribute('data-owner', top.owner);
    }

    if (x === unicorn.x && y === unicorn.y) {
      el.innerHTML = `
        <div class="unicorn-container">
          <span>🦄</span>
          <span class="dir-indicator">${DIR_SYMBOLS[unicorn.dir]}</span>
        </div>
      `;
    }
  });

  playerKeys.forEach(k => {
    document.getElementById(`${k}-coins`).innerText = players[k].coins;
    document.getElementById(`${k}-carpets`).innerText = players[k].carpets;
    document.getElementById(`${k}-name`).innerText = players[k].name;
    document.getElementById(`${k}-card`).className = `player-info ${currentPlayer === k ? 'active' : ''}`;
  });

  document.getElementById('turn-indicator').innerText = `轮到：${players[currentPlayer].name}`;
}

/* ================= 联机通信逻辑 (PeerJS) ================= */

document.getElementById('create-room-btn').addEventListener('click', createRoom);
document.getElementById('join-room-btn').addEventListener('click', joinRoom);

function createRoom() {
  const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
  peer = new Peer('unic_' + roomCode);

  document.getElementById('room-status').innerText = '正在创建房间...';

  peer.on('open', (id) => {
    isHost = true;
    isOnlineMode = true;
    myPlayerKey = 'p1';
    players.p1.isAI = false;
    document.getElementById('room-status').innerText = `房间码：${roomCode} (等待加入)`;
    log(`🏠 成功创建房间！房间码为：<b>${roomCode}</b>`);
  });

  peer.on('connection', (conn) => {
    conn.on('open', () => {
      let newKey = !connections['p2'] ? 'p2' : (!connections['p3'] ? 'p3' : null);
      if (!newKey) {
        conn.send({ type: 'FULL' });
        return;
      }

      connections[newKey] = conn;
      players[newKey].name = `玩家 (${newKey.toUpperCase()})`;
      players[newKey].isAI = false;

      log(`🎮 ${players[newKey].name} 加入了房间！`);

      // 告知对方他的身份 key
      conn.send({ type: 'INIT_IDENTITY', key: newKey, players: getPlayersData() });

      // 广播更新所有玩家信息
      broadcast({ type: 'UPDATE_PLAYERS', players: getPlayersData() });
      render();

      setupConnListeners(conn, newKey);
    });
  });

  peer.on('error', (err) => {
    alert("创建房间失败，建议重试或更换网络连接。");
    document.getElementById('room-status').innerText = '创建失败';
  });
}

function joinRoom() {
  const code = document.getElementById('room-code-input').value.trim();
  if (code.length !== 4) {
    alert("请输入4位数字房间码！");
    return;
  }

  peer = new Peer();
  document.getElementById('room-status').innerText = '正在加入...';

  peer.on('open', () => {
    const conn = peer.connect('unic_' + code);
    
    conn.on('open', () => {
      isHost = false;
      isOnlineMode = true;
      setupConnListeners(conn, 'host');
    });

    peer.on('error', () => {
      alert("无法找到该房间或房间已关闭！");
      document.getElementById('room-status').innerText = '加入失败';
    });
  });
}

function setupConnListeners(conn, key) {
  conn.on('data', (data) => {
    if (data.type === 'FULL') {
      alert("房间已满！");
      return;
    }

    if (data.type === 'INIT_IDENTITY') {
      myPlayerKey = data.key;
      document.getElementById('room-status').innerText = `已加入 (你是 ${myPlayerKey.toUpperCase()})`;
      log(`✅ 成功加入房间！你的身份是：<b>${myPlayerKey.toUpperCase()}</b>`);
      updatePlayersData(data.players);
    }

    if (data.type === 'UPDATE_PLAYERS') {
      updatePlayersData(data.players);
    }

    if (data.type === 'SYNC_ACTION') {
      // 房主转发给其他人
      if (isHost) {
        broadcastExcept(data, key);
      }
      handleRemoteAction(data);
    }
  });
}

function broadcast(data) {
  Object.values(connections).forEach(c => c && c.send(data));
}

function broadcastExcept(data, exceptKey) {
  Object.keys(connections).forEach(k => {
    if (k !== exceptKey && connections[k]) {
      connections[k].send(data);
    }
  });
}

function getPlayersData() {
  let res = {};
  playerKeys.forEach(k => {
    res[k] = { name: players[k].name, isAI: players[k].isAI };
  });
  return res;
}

function updatePlayersData(pData) {
  playerKeys.forEach(k => {
    if (pData[k]) {
      players[k].name = pData[k].name;
      players[k].isAI = pData[k].isAI;
    }
  });
  render();
}

function sendSyncAction(actionPayload) {
  if (!isOnlineMode) return;
  const payload = { type: 'SYNC_ACTION', sender: myPlayerKey, ...actionPayload };
  if (isHost) {
    broadcast(payload);
  } else {
    Object.values(connections)[0]?.send(payload);
  }
}

function handleRemoteAction(data) {
  if (data.action === 'ROLL_MOVE') {
    executeMoveAction(data.sender, data.dirChoice, data.steps);
  } else if (data.action === 'PLACE_CARPET') {
    validateAndPlaceCarpet(data.pos1, data.pos2, data.sender);
    endTurn();
  }
}

/* ================= 游戏核心逻辑 ================= */

function moveUnicornStep() {
  let vec = DIR_VECTORS[unicorn.dir];
  let nx = unicorn.x + vec.x;
  let ny = unicorn.y + vec.y;

  if (ny >= SIZE) {
    if (unicorn.x === 0) { unicorn.dir = 1; }
    else {
      if (unicorn.x === 1) unicorn.x = 2;
      else if (unicorn.x === 2) unicorn.x = 1;
      else if (unicorn.x === 3) unicorn.x = 4;
      else if (unicorn.x === 4) unicorn.x = 3;
      else if (unicorn.x === 5) unicorn.x = 6;
      else if (unicorn.x === 6) { unicorn.x = 5; unicorn.y = SIZE - 1; unicorn.dir = 2; return; }
      unicorn.y = SIZE - 1;
      unicorn.dir = 2;
    }
  } else if (ny < 0) {
    if (unicorn.x === 6) { unicorn.dir = 3; }
    else if (unicorn.x === 0) { unicorn.x = 1; unicorn.y = 0; unicorn.dir = 0; }
    else {
      if (unicorn.x === 1) unicorn.x = 0;
      else if (unicorn.x === 2) unicorn.x = 3;
      else if (unicorn.x === 3) unicorn.x = 2;
      else if (unicorn.x === 4) unicorn.x = 5;
      else if (unicorn.x === 5) unicorn.x = 4;
      unicorn.y = 0;
      unicorn.dir = 0;
    }
  } else if (nx < 0) {
    if (unicorn.y === 0) { unicorn.x = 0; unicorn.y = 1; unicorn.dir = 1; }
    else if (unicorn.y === SIZE - 1) { unicorn.dir = 2; }
    else {
      if (unicorn.y === 1) unicorn.y = 0;
      else if (unicorn.y === 2) unicorn.y = 3;
      else if (unicorn.y === 3) unicorn.y = 2;
      else if (unicorn.y === 4) unicorn.y = 5;
      else if (unicorn.y === 5) unicorn.y = 4;
      else if (unicorn.y === 6) unicorn.y = 5;
      unicorn.x = 0;
      unicorn.dir = 1;
    }
  } else if (nx >= SIZE) {
    if (unicorn.y === SIZE - 1) { unicorn.x = SIZE - 1; unicorn.y = SIZE - 2; unicorn.dir = 3; }
    else if (unicorn.y === 0) { unicorn.dir = 0; }
    else {
      if (unicorn.y === 0) unicorn.y = 6;
      else if (unicorn.y === 1) unicorn.y = 2;
      else if (unicorn.y === 2) unicorn.y = 1;
      else if (unicorn.y === 3) unicorn.y = 4;
      else if (unicorn.y === 4) unicorn.y = 3;
      else if (unicorn.y === 5) unicorn.y = 6;
      unicorn.x = SIZE - 1;
      unicorn.dir = 3;
    }
  } else {
    unicorn.x = nx;
    unicorn.y = ny;
  }
}

document.getElementById('roll-btn').addEventListener('click', () => {
  if (gameState !== 'MOVE_SELECT' || currentPlayer !== myPlayerKey) return;
  
  const actionChoice = document.getElementById('dir-input').value;
  const steps = Math.floor(Math.random() * 4) + 1;

  // 发送动作同步
  sendSyncAction({ action: 'ROLL_MOVE', dirChoice: actionChoice, steps: steps });
  
  executeMoveAction(myPlayerKey, actionChoice, steps);
});

function startTurnAction(playerKey) {
  if (players[playerKey].isAI) {
    // 房主代跑 AI
    if (isOnlineMode && !isHost) return;

    const choices = ['forward', 'left', 'right'];
    const actionChoice = choices[Math.floor(Math.random() * choices.length)];
    const steps = Math.floor(Math.random() * 4) + 1;

    sendSyncAction({ action: 'ROLL_MOVE', dirChoice: actionChoice, steps: steps });
    executeMoveAction(playerKey, actionChoice, steps);
  }
}

function executeMoveAction(playerKey, actionChoice, steps) {
  let actionText = "直行";
  if (actionChoice === 'left') {
    unicorn.dir = (unicorn.dir + 3) % 4;
    actionText = "向左转";
  } else if (actionChoice === 'right') {
    unicorn.dir = (unicorn.dir + 1) % 4;
    actionText = "向右转";
  }

  log(`${players[playerKey].name} 选择了【${actionText}】，掷出了 <b>${steps}</b> 点！`);

  document.getElementById('roll-btn').disabled = true;
  gameState = 'ANIMATING';

  let currentStep = 0;
  let stepInterval = setInterval(() => {
    if (currentStep < steps) {
      moveUnicornStep();
      render();
      currentStep++;
    } else {
      clearInterval(stepInterval);
      checkRent();
      gameState = 'CARPET_SELECT';
      
      allowedRange = hasValidPairsInBox(1) ? 1 : 2;
      
      if (currentPlayer === myPlayerKey) {
        if (allowedRange === 1) {
          document.getElementById('action-hint').innerText = "步骤：请在 3x3 九宫格内选择 2 个相邻格子铺地毯";
        } else {
          document.getElementById('action-hint').innerText = "⚠️ 九宫格内无解！已扩展至 5x5 范围";
        }
      } else {
        document.getElementById('action-hint').innerText = `等待 ${players[currentPlayer].name} 铺设地毯...`;
      }
      
      highlightValidCarpetOptions();

      if (players[playerKey].isAI && (!isOnlineMode || isHost)) {
        setTimeout(() => aiExecuteCarpet(playerKey), 1000);
      }
    }
  }, 300);
}

function checkRent() {
  const stack = boardData[unicorn.y][unicorn.x];
  if (stack.length === 0) return;

  const topOwner = stack[stack.length - 1].owner;
  if (topOwner === currentPlayer) return;

  let visited = Array(SIZE).fill(false).map(() => Array(SIZE).fill(false));
  let queue = [{x: unicorn.x, y: unicorn.y}];
  visited[unicorn.y][unicorn.x] = true;
  let areaSize = 0;

  while (queue.length > 0) {
    let curr = queue.shift();
    areaSize++;

    const neighbors = [
      {x: curr.x+1, y: curr.y}, {x: curr.x-1, y: curr.y},
      {x: curr.x, y: curr.y+1}, {x: curr.x, y: curr.y-1}
    ];

    for (let n of neighbors) {
      if (n.x >= 0 && n.x < SIZE && n.y >= 0 && n.y < SIZE && !visited[n.y][n.x]) {
        const nStack = boardData[n.y][n.x];
        if (nStack.length > 0 && nStack[nStack.length - 1].owner === topOwner) {
          visited[n.y][n.x] = true;
          queue.push(n);
        }
      }
    }
  }

  log(`⚠️ 踩中 ${players[topOwner].name} 的地盘！连通面积 ${areaSize} 格，支付 ${areaSize} 金币租金！`);
  players[currentPlayer].coins -= areaSize;
  players[topOwner].coins += areaSize;
  render();
}

function checkCarpetValidity(pos1, pos2) {
  const s1 = boardData[pos1.y][pos1.x];
  const s2 = boardData[pos2.y][pos2.x];
  
  let top1 = s1.length > 0 ? s1[s1.length - 1] : null;
  let top2 = s2.length > 0 ? s2[s2.length - 1] : null;

  let owner1 = top1 ? top1.owner : null;
  let owner2 = top2 ? top2.owner : null;

  if (owner1 !== null && owner2 !== null && owner1 === owner2) {
    return false;
  }
  return true;
}

function hasValidPairsInBox(range) {
  let neighbors = [];
  for (let dx = -range; dx <= range; dx++) {
    for (let dy = -range; dy <= range; dy++) {
      let nx = unicorn.x + dx;
      let ny = unicorn.y + dy;
      if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && !(nx === unicorn.x && ny === unicorn.y)) {
        neighbors.push({x: nx, y: ny});
      }
    }
  }

  for (let i = 0; i < neighbors.length; i++) {
    for (let j = i + 1; j < neighbors.length; j++) {
      let p1 = neighbors[i];
      let p2 = neighbors[j];
      if (Math.abs(p1.x - p2.x) + Math.abs(p1.y - p2.y) === 1) {
        if (range === 2) {
          const p1In3 = Math.abs(p1.x - unicorn.x) <= 1 && Math.abs(p1.y - unicorn.y) <= 1;
          const p2In3 = Math.abs(p2.x - unicorn.x) <= 1 && Math.abs(p2.y - unicorn.y) <= 1;
          if (!p1In3 && !p2In3) continue;
        }
        if (checkCarpetValidity(p1, p2)) return true;
      }
    }
  }
  return false;
}

function highlightValidCarpetOptions() {
  selectedCells = [];
  document.querySelectorAll('.cell').forEach(el => {
    const x = parseInt(el.dataset.x);
    const y = parseInt(el.dataset.y);
    if (Math.abs(x - unicorn.x) <= allowedRange && Math.abs(y - unicorn.y) <= allowedRange && !(x === unicorn.x && y === unicorn.y)) {
      el.classList.add('highlight');
    }
  });
}

function handleCellClick(x, y) {
  if (gameState !== 'CARPET_SELECT' || currentPlayer !== myPlayerKey) return;
  if (x === unicorn.x && y === unicorn.y) return;
  if (Math.abs(x - unicorn.x) > allowedRange || Math.abs(y - unicorn.y) > allowedRange) return;

  if (selectedCells.length === 0) {
    selectedCells.push({x, y});
    getCellEl(x, y).classList.add('selected');
  } else if (selectedCells.length === 1) {
    const first = selectedCells[0];
    const firstIn3 = Math.abs(first.x - unicorn.x) <= 1 && Math.abs(first.y - unicorn.y) <= 1;
    const secondIn3 = Math.abs(x - unicorn.x) <= 1 && Math.abs(y - unicorn.y) <= 1;

    let validRangeRule = (allowedRange === 1) ? (firstIn3 && secondIn3) : (firstIn3 || secondIn3);

    if (Math.abs(first.x - x) + Math.abs(first.y - y) === 1 && validRangeRule) {
      if (validateAndPlaceCarpet(selectedCells[0], {x, y}, myPlayerKey)) {
        sendSyncAction({ action: 'PLACE_CARPET', pos1: selectedCells[0], pos2: {x, y} });
        endTurn();
      } else {
        resetSelection();
      }
    } else {
      log("❌ 位置不符合当前范围规则！");
      resetSelection();
    }
  }
}

function resetSelection() {
  selectedCells = [];
  document.querySelectorAll('.cell.selected').forEach(e => e.classList.remove('selected'));
}

function getCellEl(x, y) {
  return document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
}

function validateAndPlaceCarpet(pos1, pos2, playerKey) {
  if (!checkCarpetValidity(pos1, pos2)) {
    if (playerKey === myPlayerKey) {
      log("❌ 非法铺设：不能同时覆盖两格最上层都是同色地毯！");
    }
    return false;
  }

  const carpetId = `${playerKey}_${Date.now()}_${Math.random()}`;
  boardData[pos1.y][pos1.x].push({ owner: playerKey, id: carpetId });
  boardData[pos2.y][pos2.x].push({ owner: playerKey, id: carpetId });

  players[playerKey].carpets--;
  log(`${players[playerKey].name} 铺设地毯于 (${pos1.x},${pos1.y}) 和 (${pos2.x},${pos2.y})`);
  return true;
}

function aiExecuteCarpet(aiKey) {
  if (gameState !== 'CARPET_SELECT') return;

  let rangeToUse = allowedRange;
  let neighbors = [];
  for (let dx = -rangeToUse; dx <= rangeToUse; dx++) {
    for (let dy = -rangeToUse; dy <= rangeToUse; dy++) {
      let nx = unicorn.x + dx;
      let ny = unicorn.y + dy;
      if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && !(nx === unicorn.x && ny === unicorn.y)) {
        neighbors.push({x: nx, y: ny});
      }
    }
  }

  let validPairs = [];
  for (let i = 0; i < neighbors.length; i++) {
    for (let j = i + 1; j < neighbors.length; j++) {
      let p1 = neighbors[i];
      let p2 = neighbors[j];
      if (Math.abs(p1.x - p2.x) + Math.abs(p1.y - p2.y) === 1) {
        if (rangeToUse === 2) {
          const p1In3 = Math.abs(p1.x - unicorn.x) <= 1 && Math.abs(p1.y - unicorn.y) <= 1;
          const p2In3 = Math.abs(p2.x - unicorn.x) <= 1 && Math.abs(p2.y - unicorn.y) <= 1;
          if (!p1In3 && !p2In3) continue;
        }
        if (checkCarpetValidity(p1, p2)) {
          validPairs.push([p1, p2]);
        }
      }
    }
  }

  if (validPairs.length > 0) {
    const choice = validPairs[Math.floor(Math.random() * validPairs.length)];
    validateAndPlaceCarpet(choice[0], choice[1], aiKey);
    sendSyncAction({ action: 'PLACE_CARPET', pos1: choice[0], pos2: choice[1] });
  } else {
    log(`${players[aiKey].name} 无合法位置可铺，跳过`);
  }

  endTurn();
}

function endTurn() {
  resetSelection();
  render();

  let allOutOfCarpets = playerKeys.every(k => players[k].carpets === 0);
  if (allOutOfCarpets) {
    checkGameOver();
    return;
  }

  currentPlayerIndex = (currentPlayerIndex + 1) % playerKeys.length;
  currentPlayer = playerKeys[currentPlayerIndex];

  gameState = 'MOVE_SELECT';
  const isMyTurn = (currentPlayer === myPlayerKey);
  
  document.getElementById('roll-btn').disabled = !isMyTurn || players[currentPlayer].isAI;
  
  if (isMyTurn) {
    document.getElementById('action-hint').innerText = "步骤：请选择策略并掷骰子";
  } else {
    document.getElementById('action-hint').innerText = `等待 ${players[currentPlayer].name} 操作...`;
  }

  startTurnAction(currentPlayer);
}

function checkGameOver() {
  gameState = 'GAME_OVER';
  document.getElementById('roll-btn').disabled = true;

  let areas = {};
  playerKeys.forEach(k => areas[k] = 0);

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const stack = boardData[r][c];
      if (stack.length > 0) {
        const topOwner = stack[stack.length - 1].owner;
        if (areas[topOwner] !== undefined) {
          areas[topOwner]++;
        }
      }
    }
  }

  log("🏆 <b>游戏结束！结算如下：</b>");
  playerKeys.forEach(k => {
    log(`${players[k].name}：${players[k].coins} 金币 | 可见格子：${areas[k]}`);
  });

  let sorted = [...playerKeys].sort((a, b) => {
    if (players[b].coins !== players[a].coins) return players[b].coins - players[a].coins;
    return areas[b] - areas[a];
  });

  log(`🎉 最终胜者：<b>${players[sorted[0]].name}</b>！`);
}

createBoardDOM();
</script>
